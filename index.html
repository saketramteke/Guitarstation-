  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guitar Store</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      color: #333;
    }

    header {
      background: url('https://images.unsplash.com/photo-1511376777868-611b54f68947?auto=format&fit=crop&w=1350&q=80') center/cover no-repeat;
      height: 50vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.7);
    }

    header h1 {
      font-size: 3rem;
      background: rgba(0,0,0,0.5);
      padding: 20px 40px;
      border-radius: 10px;
    }

    .container {
      width: 90%;
      margin: 20px auto;
    }

    h2 {
      text-align: center;
      margin: 30px 0;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    .card h3 {
      margin: 10px 0 5px;
    }

    .card p {
      margin: 5px 0;
      font-weight: bold;
      color: #444;
    }

    .card button {
      background: #e67e22;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .card button:hover {
      background: #d35400;
    }

    #cart {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-top: 40px;
    }

    #cart ul {
      list-style: none;
      padding: 0;
    }

    #cart li {
      margin: 10px 0;
      padding: 8px;
      background: #f9f9f9;
      border-radius: 5px;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #222;
      color: white;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WTPH2MKS"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->
<a href="https://amplfiernation.netlify.app"> Link to netlify </a>
  <header>
    <h1>🎸 Guitar Store</h1>
  </header>

  <div class="container">
    <h2>Our Guitars</h2>
    <div class="products">
      <div class="card">
        <img src="https://images.unsplash.com/photo-1581235720704-06d3acf44925?auto=format&fit=crop&w=600&q=80" alt="Acoustic Guitar">
        <h3>Acoustic Guitar</h3>
        <p>$250</p>
        <button onclick="addToCart('Acoustic Guitar', 250)">Add to Cart</button>
      </div>
      <div class="card">
        <img src="https://images.unsplash.com/photo-1511379938547-c1f69419868d?auto=format&fit=crop&w=600&q=80" alt="Electric Guitar">
        <h3>Electric Guitar</h3>
        <p>$450</p>
        <button onclick="addToCart('Electric Guitar', 450)">Add to Cart</button>
      </div>
      <div class="card">
        <img src="https://images.unsplash.com/photo-1616628188501-8a45fb47f03e?auto=format&fit=crop&w=600&q=80" alt="Bass Guitar">
        <h3>Bass Guitar</h3>
        <p>$300</p>
        <button onclick="addToCart('Bass Guitar', 300)">Add to Cart</button>
      </div>
    </div>

    <div id="cart">
      <h2>Your Cart</h2>
      <ul id="cartItems"></ul>
      <h3>Total: $<span id="total">0</span></h3>
    </div>
  </div>

  <footer>
    <p>© 2025 Guitar Store. All rights reserved.</p>
  </footer>

  <script>
    let cart = [];
    let total = 0;

    function addToCart(product, price) {
      cart.push({product, price});
      total += price;
      updateCart();
    }

    function updateCart() {
      const cartItems = document.getElementById('cartItems');
      cartItems.innerHTML = '';
      cart.forEach(item => {
        let li = document.createElement('li');
        li.textContent = item.product + ' - $' + item.price;
        cartItems.appendChild(li);
      });
      document.getElementById('total').textContent = total;
    }
  </script>

</body>
</html>
